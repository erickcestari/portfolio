<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <meta name="author" content="Erick Cestari">
    <link rel="canonical" href="{{url}}">

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{title}} - Erick Cestari">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="{{og_image}}">

    <meta name="twitter:card" content="{{twitter_card}}">
    <meta name="twitter:title" content="{{title}} - Erick Cestari">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{og_image}}">

    <title>{{title}} - erickcestari.dev</title>

    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
    <link rel="alternate" type="application/atom+xml" title="Atom feed" href="/blog/feed.xml">

    <link rel="preload" href="/style.css" as="style">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
{{header}}

    <main id="main-content">
        <article>
            {{cover}}
            <h1>{{title}}</h1>
            <p class="post-meta"><time datetime="{{date_iso}}">{{date}}</time>{{block}}<span class="reading-time">{{reading_time}} min read</span></p>
            {{toc}}
            {{content}}
            <pre class="stamp" aria-hidden="true"
                title="This post's randomart: the SHA-256 of its slug">{{stamp}}</pre>
        </article>
    </main>

{{footer}}
    <!-- post.js enables it when the post has contents: a tap opens them. -->
    <button class="read-progress" type="button" aria-label="Show contents" disabled></button>
    <div class="toast" role="status"></div>
    <script type="module" src="/post.js"></script>
</body>

</html>
