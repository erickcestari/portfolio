[workspace]
members = ["jatai", "blog-gen", "chip8-wasm"]

[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
jatai = { path = "jatai" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
blog-gen = { path = "blog-gen" }

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true